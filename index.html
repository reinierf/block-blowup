<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2A44" />
    <meta
      name="description"
      content="Block Blowup: drag blocks, clear lines, beat your high score."
    />
    <title>Block Blowup</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="safe-probe" aria-hidden="true"></div>

    <header id="hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item combo" id="combo-wrap" hidden>
        <span id="combo">Combo ×1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Best</span>
        <span id="best">0</span>
      </div>
      <button
        id="mute"
        class="icon-button"
        type="button"
        aria-pressed="false"
        aria-label="Sound on"
      >
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
        </svg>
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9h4l5-4v14l-5-4H4z" />
          <path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5" />
        </svg>
      </button>
    </header>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h1 id="overlay-title">Game Over</h1>
        <p id="new-best" class="new-best" hidden>New best!</p>
        <p id="overlay-msg"></p>
        <button id="restart" type="button">Play again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
