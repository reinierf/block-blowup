<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0d16" />
    <meta
      name="description"
      content="Block Blowup: drag blocks, clear lines, beat your high score."
    />
    <title>Block Blowup</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="hud-item">
          <span class="hud-label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="hud-item combo" id="combo-wrap" hidden>
          <span id="combo">Combo x1</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Best</span>
          <span id="best">0</span>
        </div>
      </header>

      <canvas id="game"></canvas>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-card">
          <h1 id="overlay-title">Game Over</h1>
          <p id="overlay-msg"></p>
          <button id="restart" type="button">Play again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
