<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2A44" />
    <meta
      name="description"
      content="Block Blowup: drag blocks, clear lines, beat your high score."
    />
    <title>Block Blowup</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="stage"></div>
    <div id="safe-probe" aria-hidden="true"></div>

    <header id="hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="hud-item combo" id="combo-wrap" hidden>
        <span id="combo">Combo ×1</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Best</span>
        <span id="best">0</span>
      </div>
    </header>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <h1 id="overlay-title">Game Over</h1>
        <p id="overlay-msg"></p>
        <button id="restart" type="button">Play again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
