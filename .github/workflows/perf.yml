name: Weekly performance

on:
  # Weekly is enough: frame cost only moves when the renderer changes. Run it by hand
  # (Actions → Weekly performance → Run workflow) after renderer work.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: Frame cost under 4x CPU throttle (non-blocking)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails (and so alerts) when p95 frame cost exceeds 20 ms. Not part of the CI
      # pipeline, so it never blocks merges.
      - name: Frame cost
        run: npx playwright test --project=perf --reporter=list
        env:
          CI: 'true'
          PERF: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-report
          path: test-results
          if-no-files-found: ignore
