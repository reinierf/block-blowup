name: CI

on:
  # Doc-only changes don't touch the game, so they don't need the pipeline (or a deploy).
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, simulation, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint + Prettier
        run: npm run lint
      - name: Unit + module tests with coverage
        run: npx vitest run --project unit --project module --coverage
      - name: Simulation regression
        run: npx vitest run --project sim --passWithNoTests
      - name: Build
        run: npx vite build
      - name: Production build has no test hook
        run: npm run check:prod
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: coverage-and-sim-report
          path: |
            coverage
            sim-report*
          if-no-files-found: ignore

  e2e:
    name: Playwright (e2e, visual, PWA)
    needs: check
    runs-on: ubuntu-latest
    # Pinned image so browsers and visual baselines stay stable. Keep in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End-to-end + visual regression
        run: npx playwright test
        env:
          CI: 'true'
          VISUAL: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse CI
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # npm ci is still needed for vite preview and @lhci/cli; the build itself is reused, so
      # Lighthouse measures exactly what gets deployed.
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Mobile preset (Lighthouse default): performance and accessibility >= 0.9.
      # Installability is covered by the Playwright PWA tests (Lighthouse 12 dropped its
      # PWA category).
      - name: Lighthouse CI
        run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check, e2e, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
